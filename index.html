<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resolvedor de Equações do 1º Grau</title>
  
  <!-- KaTeX para renderização de fórmulas matemáticas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.5rem; color: #0f172a; }
    header p { color: #64748b; font-size: 0.9rem; margin-top: 4px; }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1.05rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    /* Área de pré-visualização em formato matemático */
    .preview-math-box {
      min-height: 52px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      margin-top: 6px;
      overflow-x: auto;
    }

    /* Teclado Virtual */
    .keyboard-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 12px;
      user-select: none;
    }

    .key-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      border-radius: 6px;
      padding: 12px 6px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .key-btn:hover { background: #e2e8f0; }
    .key-btn:active { background: #cbd5e1; }
    .key-op { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }
    .key-op:hover { background: #c7d2fe; }
    .key-var { background: #fef3c7; color: #92400e; border-color: #fde68a; font-weight: 700; }
    .key-var:hover { background: #fde68a; }
    .key-action { background: #fecdd3; color: #9f1239; border-color: #fca5a5; }
    .key-action:hover { background: #fca5a5; }

    .camera-box {
      border: 2px dashed #94a3b8;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 16px;
      background: #f8fafc;
    }

    .btn-group { display: flex; gap: 10px; margin-top: 14px; }
    button, .btn-upload {
      cursor: pointer;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover, .btn-upload:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }

    #preview-img { max-width: 100%; max-height: 180px; border-radius: 6px; margin-top: 10px; display: none; }

    .step-box {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 0 8px 8px 0;
    }
    .step-title { font-weight: 600; font-size: 0.9rem; color: #475569; margin-bottom: 4px; }
    .step-math { font-size: 1.15rem; overflow-x: auto; padding-top: 4px; }

    .alert { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; }
    .alert-error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Resolvedor de Equações do 1º Grau</h1>
    <p>Com teclado matemático, frações e reconhecimento por foto</p>
  </header>

  <div class="card">
    <!-- Entrada por Foto -->
    <div class="camera-box">
      <p style="font-size: 0.85rem; font-weight: 500; margin-bottom: 6px;">Fotografar caderno ou carregar imagem:</p>
      <label class="btn-upload" for="camera-input">
        📷 Tirar Foto / Carregar Imagem
      </label>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
      <br>
      <img id="preview-img" alt="Foto da Equação">
      <div id="ocr-status" style="margin-top: 8px; font-weight: 500; font-size: 0.85rem;"></div>
    </div>

    <!-- Entrada de Texto & Pré-visualização Matemática -->
    <div class="form-group">
      <label for="eq-input">Digite a equação ou use o teclado:</label>
      <input type="text" id="eq-input" placeholder="Ex: x/5 + 2 = 7 ou (2x-1)/3 = 5" value="x/5 + 2 = 7">
      
      <label style="margin-top: 8px;">Visualização Matemática:</label>
      <div class="preview-math-box" id="preview-math">$$\frac{x}{5} + 2 = 7$$</div>
    </div>

    <!-- Teclado Virtual Matemático -->
    <div class="keyboard-grid">
      <button class="key-btn key-var" data-val="x">x</button>
      <button class="key-btn key-op" data-val="/">a/b</button>
      <button class="key-btn key-op" data-val="(">(</button>
      <button class="key-btn key-op" data-val=")">)</button>
      <button class="key-btn key-action" id="key-backspace">⌫</button>

      <button class="key-btn" data-val="7">7</button>
      <button class="key-btn" data-val="8">8</button>
      <button class="key-btn" data-val="9">9</button>
      <button class="key-btn key-op" data-val="+">+</button>
      <button class="key-btn key-op" data-val="-">−</button>

      <button class="key-btn" data-val="4">4</button>
      <button class="key-btn" data-val="5">5</button>
      <button class="key-btn" data-val="6">6</button>
      <button class="key-btn key-op" data-val="*">×</button>
      <button class="key-btn key-op" data-val="=">=</button>

      <button class="key-btn" data-val="1">1</button>
      <button class="key-btn" data-val="2">2</button>
      <button class="key-btn" data-val="3">3</button>
      <button class="key-btn" data-val="0">0</button>
      <button class="key-btn key-action" id="key-clear">C</button>
    </div>

    <div class="btn-group">
      <button id="btn-resolver" style="flex: 1;">Resolver Passo a Passo</button>
      <button id="btn-limpar" class="btn-secondary">Limpar Tudo</button>
    </div>
  </div>

  <!-- Resultados -->
  <div id="alert-container"></div>
  <div id="resultado-card" class="card" style="display: none;">
    <h2 style="font-size: 1.15rem; margin-bottom: 16px;">Passo a Passo da Resolução:</h2>
    <div id="passos-lista"></div>
  </div>
</div>

<script>
  // ==========================================
  // CONFIGURAÇÃO DO BACKEND SERVERLESS (OCR)
  // ==========================================
  const OCR_ENDPOINT = 'https://equacoes.vercel.app/api/ocr';

  async function extrairEquacaoDaImagem(base64Data, mimeType) {
    const response = await fetch(OCR_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ base64Data, mimeType })
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || "Erro ao processar imagem no servidor");
    }
    return data.equacao;
  }

  // ==========================================
  // FORMATAÇÃO E PRÉ-VISUALIZAÇÃO EM LATEX
  // ==========================================
  const eqInput = document.getElementById('eq-input');
  const previewMath = document.getElementById('preview-math');

  function converterParaLatex(str) {
    if (!str || !str.trim()) return "\\text{Nenhuma equação digitada}";

    let latex = str.replace(/\s+/g, '');

    // Converte frações com parênteses: (2x+1)/3 -> \frac{2x+1}{3}
    latex = latex.replace(/\(([^)]+)\)\/(\d+|[a-zA-Z])/g, '\\frac{$1}{$2}');
    
    // Converte frações simples: x/5 ou 3x/4 ou 7/2 -> \frac{x}{5}
    latex = latex.replace(/([a-zA-Z0-9]+)\/(\d+|[a-zA-Z])/g, '\\frac{$1}{$2}');
    
    // Converte multiplicação explícita
    latex = latex.replace(/\*/g, ' \\cdot ');

    return latex;
  }

  function atualizarPreview() {
    const val = eqInput.value;
    const latex = converterParaLatex(val);
    previewMath.innerHTML = `$$${latex}$$`;
    if (window.renderMathInElement) {
      renderMathInElement(previewMath, {
        delimiters: [{ left: "$$", right: "$$", display: true }]
      });
    }
  }

  // ==========================================
  // TECLADO VIRTUAL
  // ==========================================
  document.querySelectorAll('.key-btn[data-val]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.getAttribute('data-val');
      const start = eqInput.selectionStart;
      const end = eqInput.selectionEnd;
      const textoAtual = eqInput.value;

      eqInput.value = textoAtual.substring(0, start) + val + textoAtual.substring(end);
      eqInput.focus();
      eqInput.selectionStart = eqInput.selectionEnd = start + val.length;
      atualizarPreview();
    });
  });

  document.getElementById('key-backspace').addEventListener('click', () => {
    const start = eqInput.selectionStart;
    const end = eqInput.selectionEnd;
    const textoAtual = eqInput.value;

    if (start === end && start > 0) {
      eqInput.value = textoAtual.substring(0, start - 1) + textoAtual.substring(end);
      eqInput.selectionStart = eqInput.selectionEnd = start - 1;
    } else if (start !== end) {
      eqInput.value = textoAtual.substring(0, start) + textoAtual.substring(end);
      eqInput.selectionStart = eqInput.selectionEnd = start;
    }
    eqInput.focus();
    atualizarPreview();
  });

  document.getElementById('key-clear').addEventListener('click', () => {
    eqInput.value = '';
    eqInput.focus();
    atualizarPreview();
  });

  eqInput.addEventListener('input', atualizarPreview);

  // ==========================================
  // MOTOR ALGÉBRICO COM SUPORTE A FRAÇÕES E MMC
  // ==========================================
  function gcd(a, b) {
    a = Math.abs(a);
    b = Math.abs(b);
    while (b) { let t = b; b = a % b; a = t; }
    return a;
  }

  function lcm(a, b) {
    return (Math.abs(a * b)) / gcd(a, b);
  }

  function simplificarFracao(num, den) {
    if (den < 0) { num = -num; den = -den; }
    const divisor = gcd(num, den);
    return { num: num / divisor, den: den / divisor };
  }

  function extrairDenominadores(str) {
    const regex = /\/([0-9]+)/g;
    const dens = [];
    let match;
    while ((match = regex.exec(str)) !== null) {
      dens.push(parseInt(match[1], 10));
    }
    return dens.filter(d => d > 1);
  }

  function avaliarMembroLinear(exprStr) {
    // Normalização básica
    let expr = exprStr.replace(/\s+/g, '')
                      .replace(/(\d)([a-zA-Z(])/g, '$1*$2')
                      .replace(/\)([a-zA-Z0-9(])/g, ')*$1');

    // Expansão de parênteses simples
    const regexParen = /([+-]?\d*)\*?\(([^)]+)\)/g;
    expr = expr.replace(regexParen, (match, fatorStr, conteudo) => {
      let fator = 1;
      if (fatorStr === '-' || fatorStr === '-1') fator = -1;
      else if (fatorStr === '+' || fatorStr === '') fator = 1;
      else fator = parseFloat(fatorStr);

      conteudo = conteudo.replace(/-/g, '+-');
      const partes = conteudo.split('+').filter(p => p !== '');
      let res = '';
      partes.forEach(p => {
        let coef = 0, isVar = false;
        if (p.includes('x') || p.includes('X')) {
          isVar = true;
          let v = p.replace(/x/gi, '').replace('*', '');
          coef = (v === '-' ? -1 : v === '' ? 1 : parseFloat(v)) * fator;
          res += `${coef >= 0 && res ? '+' : ''}${coef}x`;
        } else {
          coef = parseFloat(p) * fator;
          res += `${coef >= 0 && res ? '+' : ''}${coef}`;
        }
      });
      return res.startsWith('+') ? res : '+' + res;
    });

    // Decomposição dos termos aditivos
    expr = expr.replace(/-/g, '+-');
    const termos = expr.split('+').filter(p => p !== '');
    let totalX = 0;
    let totalConst = 0;

    termos.forEach(t => {
      t = t.trim();
      let div = 1;
      let base = t;

      if (t.includes('/')) {
        const dPartes = t.split('/');
        base = dPartes[0];
        div = parseFloat(dPartes[1]) || 1;
      }

      if (base.includes('x') || base.includes('X')) {
        let v = base.replace(/x/gi, '').replace('*', '');
        let c = (v === '-' ? -1 : v === '' ? 1 : parseFloat(v)) / div;
        totalX += c;
      } else {
        totalConst += (parseFloat(base) || 0) / div;
      }
    });

    return { coefX: totalX, constVal: totalConst };
  }

  function resolverEquacao(equacaoStr) {
    const passos = [];
    if (!equacaoStr.includes('=')) {
      throw new Error("A expressão precisa conter o sinal de igualdade (=).");
    }

    const membros = equacaoStr.split('=');
    if (membros.length !== 2) {
      throw new Error("Apenas um sinal '=' é permitido.");
    }

    let lhsRaw = membros[0].trim();
    let rhsRaw = membros[1].trim();

    passos.push({
      descricao: "Equação inicial identificada:",
      latex: `${converterParaLatex(lhsRaw)} = ${converterParaLatex(rhsRaw)}`
    });

    // Tratamento de Frações e MMC
    const denominadores = extrairDenominadores(equacaoStr);
    if (denominadores.length > 0) {
      let mmc = denominadores.reduce((acc, curr) => lcm(acc, curr), denominadores[0]);
      if (mmc > 1) {
        passos.push({
          descricao: `Encontrando o MMC dos denominadores (${denominadores.join(', ')}): MMC = ${mmc}. Multiplicando ambos os membros por ${mmc} para eliminar as frações:`,
          latex: `${mmc} \\cdot \\left(${converterParaLatex(lhsRaw)}\\right) = ${mmc} \\cdot \\left(${converterParaLatex(rhsRaw)}\\right)`
        });
      }
    }

    // Avaliação dos membros
    const lhs = avaliarMembroLinear(lhsRaw);
    const rhs = avaliarMembroLinear(rhsRaw);

    const lhsX = Math.round(lhs.coefX * 1000000) / 1000000;
    const lhsC = Math.round(lhs.constVal * 1000000) / 1000000;
    const rhsX = Math.round(rhs.coefX * 1000000) / 1000000;
    const rhsC = Math.round(rhs.constVal * 1000000) / 1000000;

    passos.push({
      descricao: "Simplificando os termos de cada membro:",
      latex: `${lhsX !== 0 ? lhsX + 'x' : ''} ${lhsC >= 0 ? '+ ' + lhsC : '- ' + Math.abs(lhsC)} = ${rhsX !== 0 ? rhsX + 'x' : ''} ${rhsC >= 0 ? '+ ' + rhsC : '- ' + Math.abs(rhsC)}`
    });

    const finalX = Math.round((lhsX - rhsX) * 1000000) / 1000000;
    const finalC = Math.round((rhsC - lhsC) * 1000000) / 1000000;

    passos.push({
      descricao: "Isolando os termos com x no 1º membro e os termos numéricos no 2º membro:",
      latex: `${lhsX}x ${rhsX >= 0 ? '- ' + rhsX : '+ ' + Math.abs(rhsX)}x = ${rhsC} ${lhsC >= 0 ? '- ' + lhsC : '+ ' + Math.abs(lhsC)}`
    });

    passos.push({
      descricao: "Reduzindo os termos semelhantes:",
      latex: `${finalX}x = ${finalC}`
    });

    if (finalX === 0) {
      if (finalC === 0) {
        passos.push({
          descricao: "Resultado:",
          latex: `0x = 0 \\implies \\text{Equação indeterminada (infinitas soluções)}`
        });
      } else {
        passos.push({
          descricao: "Resultado:",
          latex: `0x = ${finalC} \\implies \\text{Equação impossível (sem solução)}`
        });
      }
      return passos;
    }

    // Conversão de números decimais para inteiros para simplificar fração
    let numerador = finalC;
    let denominador = finalX;
    let precisao = 1;
    while (!Number.isInteger(numerador) || !Number.isInteger(denominador)) {
      numerador *= 10;
      denominador *= 10;
      precisao *= 10;
    }

    const fracao = simplificarFracao(Math.round(numerador), Math.round(denominador));

    if (fracao.den === 1) {
      passos.push({
        descricao: "Dividindo ambos os lados pelo coeficiente de x:",
        latex: `x = ${fracao.num}`
      });
      passos.push({
        descricao: "Conjunto Solução:",
        latex: `S = \\{${fracao.num}\\}`
      });
    } else {
      passos.push({
        descricao: "Dividindo pelo coeficiente de x e simplificando a fração:",
        latex: `x = \\frac{${fracao.num}}{${fracao.den}}`
      });
      passos.push({
        descricao: "Conjunto Solução:",
        latex: `S = \\left\\{ \\frac{${fracao.num}}{${fracao.den}} \\right\\}`
      });
    }

    return passos;
  }

  // ==========================================
  // ELEMENTOS E EVENTOS DA INTERFACE
  // ==========================================
  const btnResolver = document.getElementById('btn-resolver');
  const btnLimpar = document.getElementById('btn-limpar');
  const cameraInput = document.getElementById('camera-input');
  const previewImg = document.getElementById('preview-img');
  const ocrStatus = document.getElementById('ocr-status');
  const resultadoCard = document.getElementById('resultado-card');
  const passosLista = document.getElementById('passos-lista');
  const alertContainer = document.getElementById('alert-container');

  function renderPassos(passos) {
    passosLista.innerHTML = '';
    passos.forEach((p, idx) => {
      const stepDiv = document.createElement('div');
      stepDiv.className = 'step-box';
      stepDiv.innerHTML = `
        <div class="step-title">Passo ${idx + 1}: ${p.descricao}</div>
        <div class="step-math">$$${p.latex}$$</div>
      `;
      passosLista.appendChild(stepDiv);
    });
    resultadoCard.style.display = 'block';
    
    if (window.renderMathInElement) {
      renderMathInElement(passosLista, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ]
      });
    }
  }

  function dispararResolucao() {
    alertContainer.innerHTML = '';
    const formula = eqInput.value.trim();
    if (!formula) {
      alertContainer.innerHTML = `<div class="alert alert-error">Digite ou fotografe uma equação primeiro.</div>`;
      return;
    }

    try {
      const passos = resolverEquacao(formula);
      renderPassos(passos);
    } catch (err) {
      alertContainer.innerHTML = `<div class="alert alert-error">Erro ao resolver: ${err.message}</div>`;
      resultadoCard.style.display = 'none';
    }
  }

  btnResolver.addEventListener('click', dispararResolucao);

  btnLimpar.addEventListener('click', () => {
    eqInput.value = '';
    previewImg.style.display = 'none';
    previewImg.src = '';
    resultadoCard.style.display = 'none';
    alertContainer.innerHTML = '';
    ocrStatus.innerHTML = '';
    atualizarPreview();
  });

  cameraInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    alertContainer.innerHTML = '';

    const reader = new FileReader();
    reader.onload = async (ev) => {
      const base64Url = ev.target.result;
      previewImg.src = base64Url;
      previewImg.style.display = 'block';

      const mimeType = file.type || "image/jpeg";
      const base64Data = base64Url.split(',')[1];

      ocrStatus.style.color = '#2563eb';
      ocrStatus.innerHTML = "⏳ Identificando a equação manuscrita...";

      try {
        const equacaoLida = await extrairEquacaoDaImagem(base64Data, mimeType);
        ocrStatus.style.color = '#16a34a';
        ocrStatus.innerHTML = `Equação reconhecida: <strong>${equacaoLida}</strong>`;
        eqInput.value = equacaoLida;
        atualizarPreview();
        dispararResolucao();
      } catch (err) {
        ocrStatus.style.color = '#dc2626';
        ocrStatus.innerHTML = `❌ Falha ao processar: ${err.message}`;
      }
    };
    reader.readAsDataURL(file);
  });

  // Inicialização com exemplo de fração
  window.addEventListener('DOMContentLoaded', () => {
    atualizarPreview();
    dispararResolucao();
  });
</script>

</body>
</html>
