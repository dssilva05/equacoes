<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resolvedor de Equações do 1º Grau</title>
  
  <!-- KaTeX para renderização de fórmulas matemáticas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body);"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.5rem; color: #0f172a; }
    header p { color: #64748b; font-size: 0.9rem; margin-top: 4px; }

    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07);
      border: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1.05rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }

    /* Área de pré-visualização em formato matemático */
    .preview-math-box {
      min-height: 58px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      margin-top: 6px;
      overflow-x: auto;
    }

    /* Teclado Virtual */
    .keyboard-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 12px;
      user-select: none;
    }

    .key-btn {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      border-radius: 6px;
      padding: 12px 6px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .key-btn:hover { background: #e2e8f0; }
    .key-btn:active { background: #cbd5e1; }
    .key-op { background: #e0e7ff; color: #3730a3; border-color: #c7d2fe; }
    .key-op:hover { background: #c7d2fe; }
    .key-var { background: #fef3c7; color: #92400e; border-color: #fde68a; font-weight: 700; }
    .key-var:hover { background: #fde68a; }
    .key-action { background: #fecdd3; color: #9f1239; border-color: #fca5a5; }
    .key-action:hover { background: #fca5a5; }

    .camera-box {
      border: 2px dashed #94a3b8;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 16px;
      background: #f8fafc;
    }

    .btn-group { display: flex; gap: 10px; margin-top: 14px; }
    button, .btn-upload {
      cursor: pointer;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover, .btn-upload:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }

    #preview-img { max-width: 100%; max-height: 180px; border-radius: 6px; margin-top: 10px; display: none; }

    .step-box {
      background: #f8fafc;
      border-left: 4px solid var(--primary);
      padding: 12px 16px;
      margin-bottom: 12px;
      border-radius: 0 8px 8px 0;
    }
    .step-title { font-weight: 600; font-size: 0.9rem; color: #475569; margin-bottom: 4px; }
    .step-math { font-size: 1.15rem; overflow-x: auto; padding-top: 4px; }

    .alert { padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; }
    .alert-error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Resolvedor de Equações do 1º Grau</h1>
    <p>Com teclado matemático, frações e reconhecimento por foto</p>
  </header>

  <div class="card">
    <!-- Entrada por Foto -->
    <div class="camera-box">
      <p style="font-size: 0.85rem; font-weight: 500; margin-bottom: 6px;">Fotografar caderno ou carregar imagem:</p>
      <label class="btn-upload" for="camera-input">
        📷 Tirar Foto / Carregar Imagem
      </label>
      <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
      <br>
      <img id="preview-img" alt="Foto da Equação">
      <div id="ocr-status" style="margin-top: 8px; font-weight: 500; font-size: 0.85rem;"></div>
    </div>

    <!-- Entrada de Texto & Pré-visualização Matemática -->
    <div class="form-group">
      <label for="eq-input">Digite a equação ou use o teclado:</label>
      <input type="text" id="eq-input" placeholder="Ex: x/2 + 3 = x/3 + 5" value="x/2 + 3 = x/3 + 5">
      
      <label style="margin-top: 8px;">Visualização Matemática:</label>
      <div class="preview-math-box" id="preview-math">$$\displaystyle \frac{x}{2} + 3 = \frac{x}{3} + 5$$</div>
    </div>

    <!-- Teclado Virtual Matemático -->
    <div class="keyboard-grid">
      <button class="key-btn key-var" data-val="x">x</button>
      <button class="key-btn key-op" data-val="/">a/b</button>
      <button class="key-btn key-op" data-val="(">(</button>
      <button class="key-btn key-op" data-val=")">)</button>
      <button class="key-btn key-action" id="key-backspace">⌫</button>

      <button class="key-btn" data-val="7">7</button>
      <button class="key-btn" data-val="8">8</button>
      <button class="key-btn" data-val="9">9</button>
      <button class="key-btn key-op" data-val="+">+</button>
      <button class="key-btn key-op" data-val="-">−</button>

      <button class="key-btn" data-val="4">4</button>
      <button class="key-btn" data-val="5">5</button>
      <button class="key-btn" data-val="6">6</button>
      <button class="key-btn key-op" data-val="*">×</button>
      <button class="key-btn key-op" data-val="=">=</button>

      <button class="key-btn" data-val="1">1</button>
      <button class="key-btn" data-val="2">2</button>
      <button class="key-btn" data-val="3">3</button>
      <button class="key-btn" data-val="0">0</button>
      <button class="key-btn key-action" id="key-clear">C</button>
    </div>

    <div class="btn-group">
      <button id="btn-resolver" style="flex: 1;">Resolver Passo a Passo</button>
      <button id="btn-limpar" class="btn-secondary">Limpar Tudo</button>
    </div>
  </div>

  <!-- Resultados -->
  <div id="alert-container"></div>
  <div id="resultado-card" class="card" style="display: none;">
    <h2 style="font-size: 1.15rem; margin-bottom: 16px;">Passo a Passo da Resolução:</h2>
    <div id="passos-lista"></div>
  </div>
</div>

<script>
  // Endpoint configurado para sua rota serverless na Vercel
  const OCR_ENDPOINT = 'https://equacoes.vercel.app/api/ocr';

  async function extrairEquacaoDaImagem(base64Data, mimeType) {
    const response = await fetch(OCR_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ base64Data, mimeType })
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Erro ao processar imagem no servidor");
    return data.equacao;
  }

  // ==========================================
  // ARITMÉTICA EXATA E MMC
  // ==========================================
  function gcd(a, b) {
    a = Math.abs(Math.round(a));
    b = Math.abs(Math.round(b));
    while (b) { let t = b; b = a % b; a = t; }
    return a || 1;
  }

  function lcm(a, b) {
    return Math.abs(Math.round(a * b)) / gcd(a, b);
  }

  function simplificarFracao(num, den) {
    if (den < 0) { num = -num; den = -den; }
    const divisor = gcd(num, den);
    return { num: Math.round(num / divisor), den: Math.round(den / divisor) };
  }

  // ==========================================
  // FORMATAÇÃO E PRÉ-VISUALIZAÇÃO EM LATEX
  // ==========================================
  const eqInput = document.getElementById('eq-input');
  const previewMath = document.getElementById('preview-math');

  function converterParaLatex(str) {
    if (!str || !str.trim()) return "\\text{Nenhuma equação digitada}";
    let latex = str.replace(/\s+/g, '');
    latex = latex.replace(/\(([^)]+)\)\/(\d+|[a-zA-Z])/g, '\\frac{$1}{$2}');
    latex = latex.replace(/([a-zA-Z0-9]+)\/(\d+|[a-zA-Z])/g, '\\frac{$1}{$2}');
    latex = latex.replace(/\*/g, ' \\cdot ');
    return latex;
  }

  function atualizarPreview() {
    const val = eqInput.value;
    const latex = converterParaLatex(val);
    previewMath.innerHTML = `$$\\displaystyle ${latex}$$`;
    if (window.renderMathInElement) {
      renderMathInElement(previewMath, {
        delimiters: [{ left: "$$", right: "$$", display: true }]
      });
    }
  }

  // ==========================================
  // PARSER E MOTOR PEDAGÓGICO DE EQUAÇÕES
  // ==========================================

  // Expande distributivas simples antes da separação de termos
  function expandirParenteses(exprStr) {
    let expr = exprStr.replace(/\s+/g, '')
                      .replace(/(\d)\(/g, '$1*(')
                      .replace(/\)([a-zA-Z0-9(])/g, ')*$1');

    const regexParen = /([+-]?\d*)\*?\(([^)]+)\)/g;
    return expr.replace(regexParen, (match, fatorStr, conteudo) => {
      let fator = 1;
      if (fatorStr === '-' || fatorStr === '-1') fator = -1;
      else if (fatorStr === '+' || fatorStr === '') fator = 1;
      else fator = parseInt(fatorStr, 10);

      conteudo = conteudo.replace(/-/g, '+-');
      const partes = conteudo.split('+').filter(p => p !== '');
      let res = '';
      partes.forEach(p => {
        if (p.includes('x') || p.includes('X')) {
          let v = p.replace(/x/gi, '').replace('*', '');
          let c = (v === '-' ? -1 : v === '' ? 1 : parseInt(v, 10)) * fator;
          res += `${c >= 0 && res ? '+' : ''}${c}x`;
        } else {
          let c = parseInt(p, 10) * fator;
          res += `${c >= 0 && res ? '+' : ''}${c}`;
        }
      });
      return res.startsWith('+') ? res : '+' + res;
    });
  }

  // Decompõe membro em termos: { num, den, isVar }
  function parseMembro(membroStr) {
    let s = expandirParenteses(membroStr);
    s = s.replace(/-/g, '+-');
    const tokens = s.split('+').filter(t => t !== '');

    const termos = [];
    for (let t of tokens) {
      let isVar = t.includes('x') || t.includes('X');
      let num = 1;
      let den = 1;

      if (t.includes('/')) {
        const partes = t.split('/');
        den = parseInt(partes[1], 10) || 1;
        let nStr = partes[0].replace(/x/gi, '').replace('*', '');
        if (nStr === '-' || nStr === '-1') num = -1;
        else if (nStr === '' || nStr === '+') num = 1;
        else num = parseInt(nStr, 10);
      } else {
        if (isVar) {
          let nStr = t.replace(/x/gi, '').replace('*', '');
          if (nStr === '-' || nStr === '-1') num = -1;
          else if (nStr === '' || nStr === '+') num = 1;
          else num = parseInt(nStr, 10);
        } else {
          num = parseInt(t, 10);
        }
      }
      termos.push({ num, den, isVar });
    }
    return termos;
  }

  function formatarTermoLatex(termo, primeiroDoMembro = false) {
    const sinal = termo.num < 0 ? '-' : (primeiroDoMembro ? '' : '+');
    const absNum = Math.abs(termo.num);

    if (termo.den === 1) {
      if (termo.isVar) {
        const coef = absNum === 1 ? 'x' : `${absNum}x`;
        return `${sinal} ${coef}`.trim();
      }
      return `${sinal} ${absNum}`.trim();
    } else {
      if (termo.isVar) {
        const nStr = absNum === 1 ? 'x' : `${absNum}x`;
        return `${sinal} \\frac{${nStr}}{${termo.den}}`.trim();
      }
      return `${sinal} \\frac{${absNum}}{${termo.den}}`.trim();
    }
  }

  function formatarMembro(termos) {
    if (termos.length === 0) return "0";
    return termos.map((t, idx) => formatarTermoLatex(t, idx === 0)).join(' ');
  }

  function resolverEquacao(equacaoStr) {
    const passos = [];
    if (!equacaoStr.includes('=')) throw new Error("A expressão precisa conter o sinal de igualdade (=).");

    const membros = equacaoStr.split('=');
    if (membros.length !== 2) throw new Error("Apenas um sinal '=' é permitido.");

    let lhsTermos = parseMembro(membros[0]);
    let rhsTermos = parseMembro(membros[1]);

    passos.push({
      descricao: "Equação inicial identificada:",
      latex: `${formatarMembro(lhsTermos)} = ${formatarMembro(rhsTermos)}`
    });

    // 1. Tratamento de denominadores e MMC
    const todosTermos = [...lhsTermos, ...rhsTermos];
    const denominadores = [...new Set(todosTermos.map(t => t.den).filter(d => d > 1))];

    if (denominadores.length > 0) {
      const mmc = denominadores.reduce((acc, cur) => lcm(acc, cur), denominadores[0]);

      const expressaoLhsMMC = lhsTermos.map((t, idx) => {
        const sinal = t.num < 0 ? '-' : (idx === 0 ? '' : '+');
        return `${sinal} ${mmc} \\cdot \\left(${formatarTermoLatex({ ...t, num: Math.abs(t.num) }, true)}\\right)`.trim();
      }).join(' ');

      const expressaoRhsMMC = rhsTermos.map((t, idx) => {
        const sinal = t.num < 0 ? '-' : (idx === 0 ? '' : '+');
        return `${sinal} ${mmc} \\cdot \\left(${formatarTermoLatex({ ...t, num: Math.abs(t.num) }, true)}\\right)`.trim();
      }).join(' ');

      passos.push({
        descricao: `Identificando os denominadores (${denominadores.join(', ')}). Calculamos o MMC = ${mmc} e multiplicamos cada termo por ele:`,
        latex: `${expressaoLhsMMC} = ${expressaoRhsMMC}`
      });

      // Aplica o MMC termo a termo: novo_num = (num * mmc) / den
      lhsTermos = lhsTermos.map(t => ({ num: Math.round((t.num * mmc) / t.den), den: 1, isVar: t.isVar }));
      rhsTermos = rhsTermos.map(t => ({ num: Math.round((t.num * mmc) / t.den), den: 1, isVar: t.isVar }));

      passos.push({
        descricao: "Efetuando as multiplicações e divisões para eliminar os denominadores:",
        latex: `${formatarMembro(lhsTermos)} = ${formatarMembro(rhsTermos)}`
      });
    }

    // 2. Reduzir membros antes de transpor
    let lhsX = lhsTermos.filter(t => t.isVar).reduce((acc, t) => acc + t.num, 0);
    let lhsC = lhsTermos.filter(t => !t.isVar).reduce((acc, t) => acc + t.num, 0);
    let rhsX = rhsTermos.filter(t => t.isVar).reduce((acc, t) => acc + t.num, 0);
    let rhsC = rhsTermos.filter(t => !t.isVar).reduce((acc, t) => acc + t.num, 0);

    // 3. Isolar x no 1º membro e constantes no 2º membro
    const sinalRhsX = -rhsX;
    const sinalLhsC = -lhsC;

    let transporLhs = `${lhsX !== 0 ? (lhsX === 1 ? 'x' : lhsX === -1 ? '-x' : lhsX + 'x') : ''}`;
    if (rhsX !== 0) {
      transporLhs += ` ${sinalRhsX > 0 ? '+ ' + (sinalRhsX === 1 ? 'x' : sinalRhsX + 'x') : '- ' + (Math.abs(sinalRhsX) === 1 ? 'x' : Math.abs(sinalRhsX) + 'x')}`;
    }

    let transporRhs = `${rhsC}`;
    if (lhsC !== 0) {
      transporRhs += ` ${sinalLhsC > 0 ? '+ ' + sinalLhsC : '- ' + Math.abs(sinalLhsC)}`;
    }

    passos.push({
      descricao: "Isolando os termos com incógnita no 1º membro e os termos numéricos no 2º membro:",
      latex: `${transporLhs || '0'} = ${transporRhs}`
    });

    // 4. Redução dos termos semelhantes
    const finalX = lhsX - rhsX;
    const finalC = rhsC - lhsC;

    const coefXFormatado = finalX === 1 ? 'x' : (finalX === -1 ? '-x' : `${finalX}x`);
    passos.push({
      descricao: "Reduzindo os termos semelhantes em ambos os membros:",
      latex: `${coefXFormatado} = ${finalC}`
    });

    // 5. Casos de impossibilidade ou identidade
    if (finalX === 0) {
      if (finalC === 0) {
        passos.push({
          descricao: "Classificação:",
          latex: `0x = 0 \\implies \\text{Equação indeterminada (infinitas soluções)}`
        });
      } else {
        passos.push({
          descricao: "Classificação:",
          latex: `0x = ${finalC} \\implies \\text{Equação impossível (não possui solução)}`
        });
      }
      return passos;
    }

    if (finalX === 1) {
      passos.push({
        descricao: "Solução encontrada:",
        latex: `x = ${finalC}`
      });
      passos.push({
        descricao: "Conjunto Solução:",
        latex: `S = \\{${finalC}\\}`
      });
      return passos;
    }

    // 6. Divisão final com formatação rigorosa de sinais e frações
    const fracao = simplificarFracao(finalC, finalX);
    const divisorTxt = finalX < 0 ? `(${finalX})` : `${finalX}`;

    let intermediariaLatex = '';
    if (finalX < 0 && finalC < 0) {
      intermediariaLatex = `\\frac{${Math.abs(finalC)}}{${Math.abs(finalX)}}`;
    } else if (finalX < 0 || finalC < 0) {
      intermediariaLatex = `-\\frac{${Math.abs(finalC)}}{${Math.abs(finalX)}}`;
    } else {
      intermediariaLatex = `\\frac{${finalC}}{${finalX}}`;
    }

    if (fracao.den === 1) {
      passos.push({
        descricao: `Dividindo ambos os membros por ${divisorTxt}:`,
        latex: `x = ${intermediariaLatex} = ${fracao.num}`
      });
      passos.push({
        descricao: "Conjunto Solução:",
        latex: `S = \\{${fracao.num}\\}`
      });
    } else {
      const sinalFracao = fracao.num < 0 ? '-' : '';
      passos.push({
        descricao: `Dividindo por ${divisorTxt} e simplificando a fração:`,
        latex: `x = ${intermediariaLatex} = ${sinalFracao}\\frac{${Math.abs(fracao.num)}}{${fracao.den}}`
      });
      passos.push({
        descricao: "Conjunto Solução:",
        latex: `S = \\left\\{ ${sinalFracao}\\frac{${Math.abs(fracao.num)}}{${fracao.den}} \\right\\}`
      });
    }

    return passos;
  }

  // ==========================================
  // TECLADO VIRTUAL E ENTRADA
  // ==========================================
  document.querySelectorAll('.key-btn[data-val]').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.getAttribute('data-val');
      const start = eqInput.selectionStart;
      const end = eqInput.selectionEnd;
      const txt = eqInput.value;

      eqInput.value = txt.substring(0, start) + val + txt.substring(end);
      eqInput.focus();
      eqInput.selectionStart = eqInput.selectionEnd = start + val.length;
      atualizarPreview();
    });
  });

  document.getElementById('key-backspace').addEventListener('click', () => {
    const start = eqInput.selectionStart;
    const end = eqInput.selectionEnd;
    const txt = eqInput.value;

    if (start === end && start > 0) {
      eqInput.value = txt.substring(0, start - 1) + txt.substring(end);
      eqInput.selectionStart = eqInput.selectionEnd = start - 1;
    } else if (start !== end) {
      eqInput.value = txt.substring(0, start) + txt.substring(end);
      eqInput.selectionStart = eqInput.selectionEnd = start;
    }
    eqInput.focus();
    atualizarPreview();
  });

  document.getElementById('key-clear').addEventListener('click', () => {
    eqInput.value = '';
    eqInput.focus();
    atualizarPreview();
  });

  eqInput.addEventListener('input', atualizarPreview);

  // ==========================================
  // EVENTOS DE TELA E FOTO / OCR
  // ==========================================
  const btnResolver = document.getElementById('btn-resolver');
  const btnLimpar = document.getElementById('btn-limpar');
  const cameraInput = document.getElementById('camera-input');
  const previewImg = document.getElementById('preview-img');
  const ocrStatus = document.getElementById('ocr-status');
  const resultadoCard = document.getElementById('resultado-card');
  const passosLista = document.getElementById('passos-lista');
  const alertContainer = document.getElementById('alert-container');

  function renderPassos(passos) {
    passosLista.innerHTML = '';
    passos.forEach((p, idx) => {
      const stepDiv = document.createElement('div');
      stepDiv.className = 'step-box';
      stepDiv.innerHTML = `
        <div class="step-title">Passo ${idx + 1}: ${p.descricao}</div>
        <div class="step-math">$$\\displaystyle ${p.latex}$$</div>
      `;
      passosLista.appendChild(stepDiv);
    });
    resultadoCard.style.display = 'block';

    if (window.renderMathInElement) {
      renderMathInElement(passosLista, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "$", right: "$", display: false }
        ]
      });
    }
  }

  function dispararResolucao() {
    alertContainer.innerHTML = '';
    const formula = eqInput.value.trim();
    if (!formula) {
      alertContainer.innerHTML = `<div class="alert alert-error">Digite ou fotografe uma equação primeiro.</div>`;
      return;
    }

    try {
      const passos = resolverEquacao(formula);
      renderPassos(passos);
    } catch (err) {
      alertContainer.innerHTML = `<div class="alert alert-error">Erro ao resolver: ${err.message}</div>`;
      resultadoCard.style.display = 'none';
    }
  }

  btnResolver.addEventListener('click', dispararResolucao);

  btnLimpar.addEventListener('click', () => {
    eqInput.value = '';
    previewImg.style.display = 'none';
    previewImg.src = '';
    resultadoCard.style.display = 'none';
    alertContainer.innerHTML = '';
    ocrStatus.innerHTML = '';
    atualizarPreview();
  });

  // Redimensiona fotos grandes no cliente antes do envio para a Vercel
  function comprimirImagem(file, maxWidth = 1200) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
          resolve({
            dataUrl: dataUrl,
            base64Data: dataUrl.split(',')[1],
            mimeType: 'image/jpeg'
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  cameraInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    alertContainer.innerHTML = '';
    ocrStatus.style.color = '#2563eb';
    ocrStatus.innerHTML = "⏳ Comprimindo imagem...";

    try {
      const { dataUrl, base64Data, mimeType } = await comprimirImagem(file);
      previewImg.src = dataUrl;
      previewImg.style.display = 'block';

      ocrStatus.innerHTML = "⏳ Identificando a escrita a lápis via IA...";

      const equacaoLida = await extrairEquacaoDaImagem(base64Data, mimeType);
      
      if (!equacaoLida) {
        throw new Error("Nenhum texto retornado pela IA.");
      }

      ocrStatus.style.color = '#16a34a';
      ocrStatus.innerHTML = `Equação reconhecida: <strong>${equacaoLida}</strong>`;
      eqInput.value = equacaoLida;
      atualizarPreview();
      dispararResolucao();
    } catch (err) {
      ocrStatus.style.color = '#dc2626';
      ocrStatus.innerHTML = `❌ Falha ao processar: ${err.message}`;
    }
  });

  window.addEventListener('DOMContentLoaded', () => {
    atualizarPreview();
    dispararResolucao();
  });
</script>

</body>
</html>
